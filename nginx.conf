server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/lib/site/current;
    index index.html;

    # Revalidate the unversioned HTML/CSS after a release changes.
    add_header Cache-Control "no-cache" always;
    # Same-size edits can share Git's commit timestamp; always send fresh content
    # when revalidating instead of relying on timestamp/size-based validators.
    etag off;
    if_modified_since off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
